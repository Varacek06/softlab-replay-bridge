name: Build Offline Setup ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download portable node.exe (v22.14.0 win-x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/win-x64/node.exe" -OutFile "bin/node.exe"

      - name: Compile bin/ReplayBridge.cs to bin/ReplayBridge.exe
        shell: pwsh
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /win32icon:"bin\icon.ico" /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:"bin\ReplayBridge.exe" "bin\ReplayBridge.cs"

      - name: Pack everything into ReplayEditor_Setup.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ReplayEditor_Setup" | Out-Null
          Copy-Item -Path "bin" -Destination "ReplayEditor_Setup\bin" -Recurse
          Copy-Item -Path "SETUP.bat" -Destination "ReplayEditor_Setup\"
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination "ReplayEditor_Setup\" }
          Compress-Archive -Path "ReplayEditor_Setup\*" -DestinationPath "ReplayEditor_Setup.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Replay Editor Bridge ${{ github.ref_name }}"
          files: ReplayEditor_Setup.zip
          make_latest: true